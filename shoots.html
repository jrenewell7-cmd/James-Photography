<script>

function checkPassword() {

let password =
document.getElementById("galleryPassword").value;

const galleries = {

    "smith2026":
    "clients/smith-family/gallery.html",

    "rugby2026":
    "clients/rugby-finals/gallery.html"

};

if (galleries[password]) {

window.location.href =
galleries[password];

}

else {

alert("Incorrect Password");

}

}
